[package]
name = "aw-watcher-network"
version = "0.1.0"
edition = "2024"

[dependencies]
aw-client-rust = "0.1.0"
aw-models = "0.1.0"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
default-net = "0.22.0"
ipnet = "2.11.0"
reqwest = { version = "0.13.0", features = ["blocking", "json"] }
serde = "1.0.228"
serde_json = "1.0.148"
serde_yaml = "0.9.34"
